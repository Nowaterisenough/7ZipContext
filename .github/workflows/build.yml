name: Build and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a release (main branch only)
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  BUILD_TYPE: Release
  QT_VERSION: '6.8.3'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'

jobs:
  build:
    name: Windows x64 build, tests and packages
    runs-on: windows-2022
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      commit: ${{ steps.version.outputs.commit }}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout source and pinned 7-Zip submodule
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: Test release version calculation
        run: ./tests/ReleaseVersionTests.ps1

      - name: Calculate release version
        id: version
        run: ./scripts/ci/Get-ReleaseVersion.ps1

      - name: Install Qt for MSVC 2022
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2022_64
          cache: true

      - name: Configure
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DBUILD_TESTING=ON "-DCMAKE_PREFIX_PATH=$env:QT_ROOT_DIR" "-D7ZIPCONTEXT_VERSION=$env:RELEASE_VERSION" "-D7ZIPCONTEXT_UPDATE_REPOSITORY=$env:GITHUB_REPOSITORY"

      - name: Build
        run: cmake --build build --config $env:BUILD_TYPE --parallel 4

      - name: Test archive engine and desktop workflows
        run: ctest --test-dir build -C $env:BUILD_TYPE --output-on-failure --timeout 120

      - name: Deploy application and Qt runtime
        run: |
          cmake --install build --config $env:BUILD_TYPE --prefix build/ci-install 2>&1 | Tee-Object -FilePath build/deploy.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test update installation and rollback with Windows PowerShell
        run: ./tests/UpdateHelperTests.ps1 -RuntimeDirectory build/ci-install -FailureExecutable "build/$env:BUILD_TYPE/UpdateSmokeFailure.exe"

      - name: Install .NET for the pinned WiX tool
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '8.0.x'

      - name: Package and verify MSI and portable ZIP
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          Start-Transcript -Path build/package.log
          try {
            ./scripts/ci/Build-WindowsPackages.ps1 -Version $env:RELEASE_VERSION -InstallDir build/ci-install -OutputDir build/release-packages -MsvcRuntime
          } finally {
            Stop-Transcript
          }

      - name: Upload release packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-x64-packages
          path: build/release-packages/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-x64-test-logs
          path: |
            build/Testing/Temporary/*.log
            build/*-tests.log
            build/deploy.log
            build/package.log
            build/update-helper-tests-*/*.log
            build/update-helper-tests-*/update-result.json
          if-no-files-found: ignore
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: build
    if: >-
      (github.event_name == 'push' &&
        (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: release-${{ needs.build.outputs.tag }}
      cancel-in-progress: false
    steps:
      - name: Download verified packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-x64-packages
          path: release

      - name: Verify artifact checksums
        working-directory: release
        run: sha256sum --check SHA256SUMS.txt

      - name: Refuse to reuse a tag belonging to another commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.build.outputs.commit }}
        run: |
          response=$(mktemp)
          error=$(mktemp)
          if gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" > "$response" 2> "$error"; then
            type=$(jq -r '.object.type' "$response")
            sha=$(jq -r '.object.sha' "$response")
            while [ "$type" = tag ]; do
              gh api "repos/$GH_REPO/git/tags/$sha" > "$response"
              type=$(jq -r '.object.type' "$response")
              sha=$(jq -r '.object.sha' "$response")
            done
            test "$type" = commit && test "$sha" = "$RELEASE_COMMIT"
          elif ! grep -q 'HTTP 404' "$error"; then
            cat "$error" >&2
            exit 1
          fi

      - name: Publish MSI, portable ZIP and SHA-256 checksums
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          target_commitish: ${{ needs.build.outputs.commit }}
          name: 7-Zip Context v${{ needs.build.outputs.version }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          make_latest: true
          files: |
            release/*.msi
            release/*.zip
            release/build-info.json
            release/SHA256SUMS.txt
